[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "health-buddy"
version = "0.1.0.dev0"
description = "Self-hosted health workspace: clean extraction and v1 contracts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["granian==2.8.3", "starlette==1.7.0", "anyio==4.15.1", "jsonschema==4.23.0", "cryptography==50.0.1", "cffi==2.1.1", "pycparser==3.0"]

[project.optional-dependencies]
mcp = ["mcp==2.2.0", "httpx2==2.13.1"]
sleepiq = ["alembic>=1.15,<2", "asyncsleepiq==1.7.1", "sqlalchemy>=2.0,<3", "tzdata>=2025.2"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["types-jsonschema==4.23.0.20241208", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]
browser = ["playwright>=1.51,<2"]

[project.scripts]
health-buddy = "health_buddy.cli:main"
health-buddy-mcp = "health_buddy.mcp_server:main"
health-ingest = "health_ingest.cli:main"
sleepiq-exporter = "sleepiq_exporter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/health_buddy", "src/health_ingest", "src/sleepiq_exporter"]

[tool.hatch.build.targets.sdist]
include = ["/packaging", "/src", "/scripts/*.py", "/tests", "/contracts", "/docs", "/provenance", "/health-runner/dashboard/*.py", "/health-runner/dashboard/*.js", "/health-runner/dashboard/template.html", "/health-runner/dashboard/assets/*.svg", "/health-runner/dashboard/assets/*.js", "/health-runner/dashboard/assets/*.webmanifest", "/health-runner/dashboard/tests", "/health-runner/dashboard/scripts/*.py", "/README.md", "/CONTRIBUTING.md", "/AGENTS.md", "/CLAUDE.md", "/LICENSE", "/THIRD_PARTY.md", "/pyproject.toml", "/requirements-contract.txt", "/alembic.ini", "/Makefile"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.env*", "**/*.db", "**/*.sqlite*", "**/design/**", "**/web/**"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/sleepiq_exporter/migrations/versions/*.py" = ["E501"]
"tests/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/health_buddy", "src/health_ingest", "src/sleepiq_exporter", "scripts/next_workout.py", "scripts/publish_training_day.py", "scripts/prescription_progression.py"]
warn_unreachable = true
show_error_codes = true
