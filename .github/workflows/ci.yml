name: Controlled verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controlled-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_ADDOPTS: ""
      HEALTH_TIMEZONE: America/Chicago
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      RUFF_NUM_THREADS: "1"
      HEALTH_BUDDY_TEST_SOCKET_ROOT: ${{ runner.temp }}/hb-uds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[dev,sleepiq]'
      - name: Create private socket-test directory
        id: socket_root
        run: mkdir -m 0700 -- "$HEALTH_BUDDY_TEST_SOCKET_ROOT"
      - run: make contracts test dashboard-test lint typecheck package
      - run: python scripts/audit_distribution.py --root . --archives dist
      - run: git diff --check
      - name: Remove owned empty socket-test directory
        if: ${{ always() && steps.socket_root.outcome == 'success' }}
        run: rmdir -- "$HEALTH_BUDDY_TEST_SOCKET_ROOT"
